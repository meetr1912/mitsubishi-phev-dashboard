name: Validate PHEV command relay

on:
  push:
    branches: [main]
    paths:
      - cloudflare-worker/**
      - wrangler.toml
      - .github/workflows/deploy-phev-worker.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-phev-command-relay
  cancel-in-progress: true

# Cloudflare Workers Builds owns production deployment through its Git integration.
# GitHub Actions only verifies the code before Cloudflare publishes it.
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare-worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cloudflare-worker/package-lock.json

      - run: npm ci
      - run: npm run typecheck

# Cloudflare Workers Builds is configured with this repository's root directory.
# This entrypoint lets its default `npx wrangler deploy` command resolve the
# Worker source kept in cloudflare-worker/.
name = "phev-command-relay"
main = "cloudflare-worker/src/index.ts"
compatibility_date = "2025-07-01"

[[durable_objects.bindings]]
name = "SNOW_GUARD"
class_name = "SnowGuard"

[[migrations]]
tag = "v1"
new_classes = ["SnowGuard"]

[triggers]
crons = ["*/15 * * * *"]

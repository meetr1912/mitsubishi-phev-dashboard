name = "phev-command-relay"
main = "src/index.ts"
compatibility_date = "2025-07-01"

[[durable_objects.bindings]]
name = "SNOW_GUARD"
class_name = "SnowGuard"

[[durable_objects.bindings]]
name = "ACTION_LOG"
class_name = "ActionLog"

[[migrations]]
tag = "v1"
new_classes = ["SnowGuard"]

[[migrations]]
tag = "v2"
new_classes = ["ActionLog"]

[triggers]
crons = ["*/15 * * * *"]

# Secrets are NOT stored here — set them with `wrangler secret put` (see README):
#   MMC_USERNAME, MMC_PASSWORD, MMC_PIN, DASHBOARD_API_KEY
